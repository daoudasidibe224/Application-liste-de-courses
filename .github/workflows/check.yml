name: Vérifications
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run check --prefix backend
      - run: npm test --prefix backend
      - run: npm run check --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t carnet-de-courses:test .
      - run: docker network create qa-network
      - run: docker run -d --network qa-network --name qa-mongo mongo:8
      - run: docker run -d --network qa-network --name qa-app -p 3080:3000 -e MONGODB_URI=mongodb://qa-mongo:27017/courses -e JWT_SECRET=container-integration-test-secret-at-least-32 carnet-de-courses:test
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 5 http://127.0.0.1:3080/health
      - run: curl --fail http://127.0.0.1:3080/inscription
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/api/listes)" = 401
      - if: failure()
        run: docker logs qa-app
